server:
  port: 8081

spring:
  application:
    name: kanban
  datasource:
    url: ${KANBAN_DB_URL:jdbc:postgresql://localhost:5432/kanban}
    username: ${KANBAN_DB_USER:kanban}
    password: ${KANBAN_DB_PASSWORD:kanban}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri valida a claim `iss` (endereco publico visto pelo navegador); jwk-set-uri
          # busca as chaves (endereco interno alcancavel de dentro do container).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/kanban}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8080/realms/kanban/protocol/openid-connect/certs}

kanban:
  bootstrap:
    admin-email: ${KANBAN_ADMIN_EMAIL:admin@crudao.com.br}
  cors:
    origens-permitidas: ${KANBAN_CORS_ORIGINS:http://localhost:3000}
  eventos:
    canal: board_events
    backoff-inicial-ms: 1000
    backoff-maximo-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    br.com.crudao.kanban: INFO
