# Toda credencial vem de .env (veja .env.example) — nada de segredo na imagem.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--import-realm', '--health-enabled=true']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      # `iss` emitido e sempre o endereco publico, senao o backend rejeita todo token do navegador.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      # Substituido no realm importado: a senha dos usuarios de dev nao fica no JSON versionado.
      KEYCLOAK_SEED_PASSWORD: ${KEYCLOAK_SEED_PASSWORD}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      KANBAN_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KANBAN_DB_USER: ${POSTGRES_USER}
      KANBAN_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI}
      KANBAN_ADMIN_EMAIL: ${KANBAN_ADMIN_EMAIL}
      KANBAN_CORS_ORIGINS: ${KANBAN_CORS_ORIGINS}
    ports:
      - '${BACKEND_PORT:-8081}:8081'
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8081/actuator/health/readiness || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID}
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    depends_on:
      - backend

volumes:
  postgres-data:
