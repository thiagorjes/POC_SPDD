# Proxy do arnes de broadcast (RNF-002). Existe para dar um endereco unico as
# tres replicas, de modo que o cliente nao saiba — e nao possa escolher — qual
# instancia o atendeu. Sem isso o teste mediria a instancia que ele mesmo
# escolheu, que e o unico caminho que nunca falha.
#
# O DNS interno do Compose resolve `backend-broadcast` para as tres replicas; o
# resolver com `valid` curto existe porque a lista muda quando uma replica
# reinicia, e o nginx cacheia resolucao para sempre por padrao.

resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 8080;

  location / {
    set $alvo http://backend-broadcast:8080;
    proxy_pass $alvo;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # O broadcast e WebSocket: sem o upgrade a conexao cai para HTTP comum e o
    # teste passa a medir polling.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 3600s;
  }
}
