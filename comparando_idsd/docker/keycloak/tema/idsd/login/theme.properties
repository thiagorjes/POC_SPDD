# Tema de login do IDSD.
#
# Ele existe por um motivo unico e estreito: o tema padrao rotula o botao que
# revela a senha como "Exibir senha", e esse rotulo torna a palavra "senha"
# ambigua na tela — o campo e o botao respondem pelo mesmo nome. O cenario
# congelado SCN-001.1 localiza o campo de senha pelo rotulo, e ambiguidade ali
# nao e questao de estilo: ela impede que a tela de autenticacao seja
# verificavel.
#
# Nada mais e alterado. Tudo o que nao esta declarado aqui vem do tema padrao.
parent=keycloak.v2
