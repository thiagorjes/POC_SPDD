# Suite automatizada. Arquivo proprio, nao override informal do compose.yaml:
#
#   docker compose -f docker/compose.test.yaml run --rm backend-test
#   docker compose -f docker/compose.test.yaml run --rm e2e
#
# Nenhum servico deste arquivo publica porta no host, e a rede e distinta da de
# desenvolvimento — a suite nao pode alcancar um banco de desenvolvimento por
# acidente.

name: idsd-kanban-test

networks:
  idsd-test-net:
    name: idsd-kanban-test-net
  # A suite `e2e` exercita o ambiente de desenvolvimento ja no ar, pelo
  # navegador. Ela entra na rede dele em vez de subir uma segunda copia da
  # aplicacao — duas copias divergem, e a que a pessoa ve nao e a que o teste
  # verifica.
  idsd-net:
    name: idsd-kanban-net
    external: true

volumes:
  # Cache de dependencia em volume nomeado, descartavel e nunca compartilhado
  # com volume de dados: ciclo de teste sem cache fica caro o bastante para as
  # pessoas o contornarem, e suite contornada nao verifica nada.
  idsd-m2:
  idsd-npm:

services:

  # ----------------------------------------------------------- backend-test
  backend-test:
    image: ${MAVEN_IMAGE:-maven:3.9-eclipse-temurin-25@sha256:31618505df21177d2baa3dc574be2d0b0b32614c8539baca1f23a9136b766eb0}
    restart: "no"
    networks: [idsd-test-net]
    working_dir: /workspace
    volumes:
      - ../backend:/workspace
      - idsd-m2:/root/.m2
      # UNICA montagem do socket do daemon em todo o repositorio, e ela existe
      # so aqui. Concede a este servico o equivalente a acesso root no host, e
      # e aceito apenas em desenvolvimento e CI (ADR-012). Docker dentro de
      # Docker foi descartado pelo custo de camada e pela perda de cache.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # Os contêineres que a suite cria nascem no daemon do HOST: sao irmaos
      # deste servico, nao filhos, e por isso o nome de servico do compose nao
      # os resolve. Eles sao alcancados pelo gateway do host, na porta que o
      # daemon publica — ver TESTCONTAINERS_HOST_OVERRIDE abaixo.
      - "host.docker.internal:host-gateway"
    environment:
      # Mesma variavel unica que o compose de desenvolvimento consome. "A mesma
      # imagem do compose" nao pode ser convencao em prosa: divergir de versao
      # reintroduz, mais devagar, o problema que motivou tirar o banco em
      # memoria da suite.
      POSTGRES_IMAGE: ${POSTGRES_IMAGE:-postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685}
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      TESTCONTAINERS_RYUK_DISABLED: "false"
    command: ["mvn", "-B", "verify"]

  # -------------------------------------------------------------------- e2e
  e2e:
    # A imagem ja traz os browsers. Instala-los em tempo de execucao poria um
    # download no caminho critico de cada execucao da suite.
    image: ${PLAYWRIGHT_IMAGE:-mcr.microsoft.com/playwright:v1.56.0-noble@sha256:35246d87a7c88ea9b771c65d33171b2611b02a8253b4b12ce6f94376c55f99f2}
    restart: "no"
    networks: [idsd-net]
    working_dir: /workspace
    volumes:
      - ../frontend:/workspace
      - idsd-npm:/root/.npm
    environment:
      # Pela rede interna, por nome de servico. Nada de localhost.
      BASE_URL: http://frontend:3000
      API_URL: http://backend:8080
      PROVEDOR_URL: http://keycloak:8080
    command: ["npx", "playwright", "test"]

  # ------------------------------------------------- broadcast multi-instancia
  # RNF-002 so e mensuravel com mais de uma instancia contra o mesmo banco: uma
  # instancia so mede o unico caminho que nunca falha. As tres replicas sobem
  # atras de um proxy para que o cliente as alcance por um endereco unico, sem
  # saber qual delas atendeu.
  #
  # O servico esta declarado aqui, e nao em compose.yaml, porque nao e ambiente
  # de trabalho de ninguem: e arnes de medicao. Ele nao sobe com `run --rm
  # backend-test` — precisa de `--profile broadcast`, para nao encarecer a
  # execucao comum da suite.
  backend-broadcast:
    profiles: ["broadcast"]
    image: idsd/backend:${REVISAO:-dev}
    restart: "no"
    networks: [idsd-net]
    deploy:
      replicas: 3
    environment:
      SPRING_PROFILES_ACTIVE: dev
      BANCO_URL: jdbc:postgresql://postgres:5432/${BANCO_NOME:-kanban}
      BANCO_USUARIO: ${BANCO_USUARIO:-kanban}
      IDENTIDADE_ISSUER_URI: ${IDENTIDADE_HOSTNAME:-http://localhost:8180}/realms/${IDENTIDADE_REALM:-idsd}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/${IDENTIDADE_REALM:-idsd}/protocol/openid-connect/certs
    secrets:
      - banco-senha
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  proxy-broadcast:
    profiles: ["broadcast"]
    image: ${PROXY_IMAGE:-nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de}
    restart: "no"
    networks: [idsd-net]
    depends_on:
      backend-broadcast:
        condition: service_healthy
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

secrets:
  banco-senha:
    file: ${BANCO_SENHA_FILE:-./secrets/banco-senha.dev}
