version: 1
id: emergencia
nome: Contenção de incidente
framework: SSPDD
atende: [emergencia]

# Contain → Fix → Verify → Release.
# A ordem se inverte; nenhuma etapa é eliminada. As etapas marcadas
# `posterior: true` viram dívida de reconciliação, visível e bloqueante,
# com o prazo definido na policy gates-por-classe.

etapas:
  - skill: /classify
    camada: control
    satisfaz: [GATE-CLASSIFY]
  - skill: /context
    camada: control
    satisfaz: [GATE-CONTEXT]
  - skill: /implement
    camada: execution
    modo: contencao
    satisfaz: []
  - skill: /evidence
    camada: execution
    satisfaz: [GATE-EVIDENCIA, GATE-DADOS]
  - skill: /intent
    camada: control
    posterior: true
    satisfaz: [GATE-INTENT]
  - skill: /prd
    camada: execution
    posterior: true
    modo: emenda-de-cenario
    satisfaz: [GATE-SPEC]
  - skill: /tests
    camada: execution
    posterior: true
    satisfaz: [GATE-VERIFICACAO-INDEPENDENTE]
    restricao: sem_acesso_a_implementacao
  - skill: /code-review
    camada: execution
    posterior: true
    satisfaz: [GATE-REVISAO-TECNICA]
  - skill: /evidence
    camada: execution
    modo: reconciliacao
    posterior: true
    satisfaz: [GATE-RECONCILIACAO]
