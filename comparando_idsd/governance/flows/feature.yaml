# Flow — feature (SSPDD completo)
#
# Manifesto de flow: declara as etapas e qual gate cada etapa satisfaz.
# O registro do flow falha se os gates cobertos não incluírem todos os gates
# obrigatórios da classe declarada em `atende`.

version: 1
id: feature
nome: SSPDD — feature
framework: SSPDD
atende: [feature]

etapas:

  - skill: /intent
    camada: control
    satisfaz: [GATE-INTENT]

  - skill: /classify
    camada: control
    satisfaz: [GATE-CLASSIFY]

  - skill: /context
    camada: control
    satisfaz: [GATE-CONTEXT]

  - skill: /discovery
    camada: execution
    satisfaz: []

  - skill: /shape
    camada: execution
    satisfaz: [GATE-DIRECAO]

  - skill: /solution
    camada: execution
    satisfaz: []

  - skill: /design
    camada: execution
    opcional: true
    aciona_se: intent.tem_interface

  - skill: /prd
    camada: execution
    satisfaz: [GATE-SPEC, GATE-PROVENIENCIA]

  - skill: /techspec
    camada: execution
    satisfaz: []

  - skill: /analyze
    camada: execution
    satisfaz: [GATE-CONSISTENCIA]

  - skill: /tasks
    camada: execution
    satisfaz: [GATE-RASTREABILIDADE]

  - skill: /tests
    camada: execution
    satisfaz: [GATE-VERIFICACAO-INDEPENDENTE, GATE-GHERKIN-CONGELADO]
    restricao: sem_acesso_a_implementacao

  - skill: /implement
    camada: execution
    satisfaz: []
    restricao: sem_escrita_em_feature_e_step_defs

  - skill: /code-review
    camada: execution
    satisfaz: [GATE-REVISAO-TECNICA, GATE-NFR]
    restricao: revisor_sem_escrita

  - skill: /spdd-sync
    camada: execution
    opcional: true
    satisfaz: []
    aciona_se: canvas_drift

  - skill: /evidence
    camada: execution
    satisfaz: [GATE-EVIDENCIA, GATE-DADOS]
