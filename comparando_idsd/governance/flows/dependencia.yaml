version: 1
id: dependencia
nome: Atualização de dependência
framework: SSPDD
atende: [dependencia]

# O flow mais curto: não há comportamento novo a especificar.
# O gate de verificação é satisfeito pela suíte existente, inalterada.

etapas:
  - skill: /classify
    camada: control
    satisfaz: [GATE-CLASSIFY]
  - skill: /context
    camada: control
    satisfaz: [GATE-CONTEXT]
  - skill: /tests
    camada: execution
    modo: suite-existente-inalterada
    satisfaz: [GATE-VERIFICACAO-INDEPENDENTE]
    restricao: suite_nao_pode_ser_alterada
  - skill: /implement
    camada: execution
    satisfaz: []
  - skill: /code-review
    camada: execution
    satisfaz: [GATE-REVISAO-TECNICA]
    restricao: revisor_sem_escrita
  - skill: /evidence
    camada: execution
    satisfaz: [GATE-EVIDENCIA, GATE-DADOS]
