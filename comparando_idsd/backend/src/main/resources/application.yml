spring:
  application:
    name: kanban-tarefas

  datasource:
    url: ${BANCO_URL}
    username: ${BANCO_USUARIO}
    # A senha nao entra por variavel de ambiente: `infra/docker`
    # architecture.md secao 7 obriga arquivo montado, porque variavel vaza em
    # `docker inspect`, em log de crash e em dump de processo. O arquivo
    # `/run/secrets/banco-senha` vira a propriedade `banco-senha` pelo
    # configtree importado no documento de perfil "!test".
    password: ${banco-senha}

  jpa:
    hibernate:
      # Vale em todo perfil, inclusive teste. A aplicacao valida o schema e
      # falha se ele estiver desatualizado; autocorrecao silenciosa e como uma
      # instancia antiga migra um schema que ela nao conhece.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # A migracao roda em servico dedicado do compose e sai (ADR-011). O Flyway
  # esta no classpath porque a suite o usa para ocupar o lugar desse servico,
  # nunca porque a aplicacao migra.
  flyway:
    enabled: false

idsd:
  admin-global:
    # Sujeito designado a administracao global (ADR-010). E o `sub` do token, e
    # nunca o e-mail: e-mail e mutavel no provedor e, em realm com autocadastro,
    # atribuivel por quem se registra — casar por e-mail poria o bypass universal
    # a uma requisicao de distancia de qualquer um.
    #
    # Vazio por padrao, e vazio significa que ninguem e promovido. A ausencia de
    # configuracao nunca pode ser lida como "qualquer um serve", que e o modo de
    # falha desta classe de property.
    subject-id: ${IDSD_ADMIN_GLOBAL_SUBJECT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # ACH-03. Probe de readiness so e probe se contiver os indicadores das
        # dependencias de que o trafego depende; grupo com `readinessState`
        # sozinho e liveness com outro nome, e uma instancia com o banco fora
        # responderia pronta ao healthcheck do compose e continuaria recebendo
        # trafego.
        #
        # O indicador da conexao de escuta LISTEN ainda nao existe — ele nasce
        # com o listener, no epico do broadcast — e entra aqui quando existir.
        readiness:
          include: readinessState,db
        # Liveness observa so o processo, deliberadamente. Instabilidade do
        # banco aqui mataria todas as instancias ao mesmo tempo, durante a
        # janela em que elas se recuperariam sozinhas.
        liveness:
          include: livenessState
  health:
    # Liveness observa so o processo. Banco e conexao de escuta entram no
    # readiness: instabilidade do banco no liveness mataria todas as instancias
    # ao mesmo tempo, durante a janela em que elas se recuperariam sozinhas.
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

---
# Identidade real. Fora do perfil de teste, o issuer e obrigatorio e vem de
# variavel de ambiente — nunca de arquivo versionado.
spring:
  config:
    activate:
      on-profile: "!test"
    # Sem `optional:`: instancia que subiu sem o segredo montado deve falhar no
    # arranque, e nao adiante, na primeira conexao. Em desenvolvimento o valor e
    # descartavel, mas entra pelo mesmo mecanismo — caminho de producao que nao
    # e exercitado em desenvolvimento nao e caminho testado.
    import: "configtree:/run/secrets/"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IDENTIDADE_ISSUER_URI}

---
spring:
  config:
    activate:
      on-profile: test
  # Sem credencial literal aqui: url, usuario e senha chegam por
  # @DynamicPropertySource a partir do Testcontainers, com precedencia sobre
  # este arquivo. Valor de exemplo versionado e o comeco do habito que a
  # secao 7 de `infra/docker` proibe, e nao serviria para nada — o contêiner
  # sorteia porta e senha a cada execucao.
  security:
    oauth2:
      resourceserver:
        jwt:
          # Na suite de contrato a identidade e substituida pelo pos-processador
          # jwt() do spring-security-test, que nunca chega a validar assinatura.
          # Declarar jwk-set-uri em vez de issuer-uri evita a descoberta OIDC
          # eager na subida do contexto, que nao teria a quem perguntar.
          jwk-set-uri: http://localhost:1/jwks
