# guidelines.yaml — vínculo entre este sistema e a biblioteca compartilhada.
#
# A biblioteca é organizada por stack, não por sistema: `backend/java` vale para
# todo sistema Java. Este arquivo é o único lugar que diz quais coleções
# governam ESTE sistema — nada aqui é cópia de norma.
#
# Gerado e mantido por /guidelines (flow de setup). Verificado por
# `.agents/skills/guidelines/scripts/check_guidelines.py --sistema .`

version: 1

# Caminho da biblioteca, relativo à raiz do sistema.
raiz: ../guidelines

# Coleções que governam este sistema, no formato <camada>/<stack>.
# `<camada>` é aberto: backend, frontend, mobile, data, infra, o que houver.
# Declarar uma coleção que não existe na biblioteca reprova a verificação.
colecoes:
  - backend/{{STACK_BACKEND}}
  - frontend/{{STACK_FRONTEND}}

# Se o sistema legitimamente não tem stack governada (ferramental, repositório
# de documentação, infra declarativa), deixe `colecoes` vazio e preencha
# `motivo`. Sem um dos dois a verificação reprova — sistema sem coleção e
# sistema com coleção esquecida têm o mesmo sintoma, e só o motivo os separa.
# motivo: >
#   Repositório de ferramental em Python, sem stack de produto. As normas
#   aplicáveis são as transversais em _shared/.
