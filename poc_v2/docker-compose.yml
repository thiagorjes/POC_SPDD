services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-kanban}
      POSTGRES_USER: ${DB_USERNAME:-kanban}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kanban}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-kanban} -d ${DB_NAME:-kanban}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # iss sempre no endereco publico; o backchannel resolve o host interno dinamicamente.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
      KEYCLOAK_SEED_PASSWORD: ${KEYCLOAK_SEED_PASSWORD:-kanban123}
      KANBAN_ADMIN_EMAIL: ${KANBAN_ADMIN_EMAIL:-admin@kanban.local}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-kanban}
      DB_USERNAME: ${DB_USERNAME:-kanban}
      DB_PASSWORD: ${DB_PASSWORD:-kanban}
      SERVER_PORT: 8081
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8080}/realms/kanban
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/kanban/protocol/openid-connect/certs
      KANBAN_ADMIN_EMAIL: ${KANBAN_ADMIN_EMAIL:-admin@kanban.local}
      KANBAN_CORS_ORIGENS: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8081}
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-8080}
      NEXT_PUBLIC_KEYCLOAK_REALM: kanban
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: kanban-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
